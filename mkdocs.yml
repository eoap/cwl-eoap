site_name: EO Application Packages in 20 minutes

theme:
    logo: assets/icon-eoap.png
    name: material

    palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
plugins:
  - search
  - mermaid2:
      version: 10.6.0

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span


nav:
  - Start here · 20 minutes: index.md
  - The building blocks · 4 min: cwl/nutshell.md
  - Trace the example · 8 min: quick-start.md
  - Build, deploy and run · 3 min: usage-scenarios.md
  - Optional reference:
    - YAML in one minute: yaml.md
    - Prepare the application: best-practice/application.md
    - Prepare the package: best-practice/package.md
    - How CWL fits EOAP: cwl/cwl-eoap.md
  - History and standards:
    - From pilots to wider use: background/background.md
    - Previous OGC testbeds: background/previous-ogc-testbeds.md
    - EO Applications Pilot: background/applications-pilot.md
    - OGC Best Practice: background/eoap-best-practice.md

